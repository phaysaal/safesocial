name: spheres_app
description: Spheres — Decentralized P2P Social Network
publish_to: 'none'
version: 0.11.0+56

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^14.0.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  qr_flutter: ^4.1.0
  app_links: ^6.3.2
  mobile_scanner: ^6.0.2
  flutter_svg: ^2.0.10
  web_socket_channel: ^3.0.1
  flutter_webrtc: ^0.12.4
  permission_handler: ^11.3.1
  crypto: ^3.0.3
  image: ^4.3.0
  record: ^6.0.0
  audioplayers: ^5.2.1
  audio_waveforms: ^1.0.5
  http: ^1.6.0
  cryptography: ^2.9.0
  ed25519_edwards: ^0.3.1
  flutter_secure_storage: ^10.0.0
  # Used directly by identity_service/relay_service for hex codecs; was
  # previously relied on transitively, which is fragile.
  convert: ^3.1.1
  gal: ^2.3.3
  video_compress: ^3.1.4
  video_player: ^2.11.1
  unifiedpush: ^6.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  # Pinned: 3.5.0 builds only with the Kotlin support built into AGP 9, and
  # the toolchain is pinned to AGP 8.11 (FLUTTER_TOOLCHAIN). Lift when AGP moves.
  unifiedpush_android: 3.4.1
  local_auth: ^3.0.2
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  google_mlkit_translation: ^0.14.0
  google_mlkit_language_id: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Tests fake the documents directory to prove what is, and is not, written.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
  # Timers under test, for the rule that lets the hub rest off screen.
  fake_async: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon_1024.png
    - assets/images/logo.png
    - assets/emoticons/
    - assets/fonts/OFL.txt
    - assets/licenses/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
