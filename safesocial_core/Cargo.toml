[package]
name = "safesocial_core"
version = "0.3.0"
edition = "2021"
description = "Spheres core — DORMANT, not built into the app (see docs/rebuild_plan.md)"

# This crate is not compiled into the Flutter app and nothing calls it at
# runtime. It is kept as a reference for a possible future non-Flutter client.
# Do not add features that depend on it without reading docs/rebuild_plan.md §5.

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
veilid-core = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
gf256 = { version = "0.3", features = ["shamir", "thread-rng"] }

# Removed as unused: `prost`/`prost-build` (declared with no build.rs and no
# .proto files — the wire format is JSON via serde) and `double-ratchet` (never
# imported; ratchet.rs is a placeholder).

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
# `ffi` was declared but never gated anything — lib.rs compiles the module
# unconditionally. Left empty rather than removed so any external reference to
# `--features ffi` keeps resolving.
ffi = []
