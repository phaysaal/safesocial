name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — analyze, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safesocial_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: the Flutter version is the single largest input to the
          # compiled output, so "stable" would silently change the bytes.
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting is parseable
        run: dart format --output=none --set-exit-if-changed=false .

      # Errors and warnings fail the build. Infos do not yet — there is a
      # backlog of them (deprecated withOpacity, use_build_context_synchronously,
      # prefer_const) that is being burned down. Once it reaches zero, drop
      # --no-fatal-infos so it can never grow back.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # A debug build, deliberately. Release builds require the signing
      # keystore (android/key.properties) and now fail without it rather than
      # silently falling back to the public Android debug key.
      - name: Build debug APK
        run: flutter build apk --debug

  reproducible:
    name: Reproducible build — same inputs, same bytes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safesocial_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - run: flutter pub get

      # Build the same commit twice on one runner and compare. This checks
      # determinism — that the build does not bake in a timestamp, a path or a
      # random ordering. It does not by itself prove that a *different* machine
      # gets the same bytes; that additionally needs the pinned toolchain in
      # FLUTTER_TOOLCHAIN to be honoured, which is why those versions are
      # pinned rather than floating.
      #
      # This check has never been run. Its first result is information, not a
      # regression: if it fails, the output names the differing entries and
      # docs/reproducible_builds.md lists the usual culprits.
      - name: First build
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/first.apk

      - name: Clean
        run: flutter clean && flutter pub get

      - name: Second build
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/second.apk

      - name: Compare
        run: |
          first=$(sha256sum /tmp/first.apk | cut -d' ' -f1)
          second=$(sha256sum /tmp/second.apk | cut -d' ' -f1)
          echo "build 1: $first"
          echo "build 2: $second"
          if [ "$first" = "$second" ]; then
            echo "Reproducible: identical bytes from identical inputs."
            exit 0
          fi
          echo "NOT reproducible — the two builds differ."
          echo "Entries that differ:"
          mkdir -p /tmp/a /tmp/b
          unzip -qq -o /tmp/first.apk -d /tmp/a
          unzip -qq -o /tmp/second.apk -d /tmp/b
          diff -rq /tmp/a /tmp/b || true
          exit 1

  relay:
    name: Relay — syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check worker parses
        run: node --check worker.js

# The Rust crate (safesocial_core) is intentionally not built here. It is
# dormant: nothing loads it at runtime, no .so is bundled, and per
# docs/rebuild_plan.md it is off the critical path. Building veilid-core in CI
# would cost many minutes to validate code that does not ship. Re-add a job
# here if and when the crate is revived.
