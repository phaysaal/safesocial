name = "spheres-relay"
main = "worker.js"

# Ed25519 verification is load-bearing in v2: every mailbox read, ack and
# WebSocket upgrade is authorised by it, so if crypto.subtle cannot import an
# Ed25519 key the relay 401s everything and the only symptom is clients
# reporting Unauthorized. The standard "Ed25519" algorithm name (as opposed to
# the older "NODE-ED25519") needs a recent compatibility date, so this is
# pinned well past that change.
compatibility_date = "2025-01-01"

# The client falls back to <name>.<account>.workers.dev when the custom domain
# is unreachable. That host has to actually exist: with this off, every
# failover went to a name that does not resolve, and the retry then stayed on
# it — a channel that blipped once was stranded until the app restarted.
workers_dev = true

# Custom domain
routes = [
  { pattern = "relay.spheres.dev", custom_domain = true }
]

# Durable Objects for mailbox state. Also provides the alarm API, used to
# expire old mail on a timer rather than only when something is written.
[durable_objects]
bindings = [
  { name = "RELAY_ROOM", class_name = "RelayRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# NOTE ON ORPHANED v1 DATA
#
# v2 addresses Durable Objects by new names (mbx_*, inbox_*, blob_*, prekey_*),
# so every object v1 created becomes unreachable — but unreachable is not
# deleted, and v1 set no alarms, so that storage persists.
#
# Purging it needs `deleted_classes`, and Cloudflare refuses that while any
# binding references the class (error 10061). Doing it properly means deploying
# once with the binding removed and again to restore it, which leaves a window
# where every request fails. That was judged not worth doing to a live relay
# for data that is already unreachable; see relay/README.md.
