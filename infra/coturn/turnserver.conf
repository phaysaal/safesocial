# Spheres TURN. Credentials are minted by the relay (HMAC-SHA1 over the
# secret, see relay/worker.js handleTurn); nothing here identifies a user.
listening-port=3478
tls-listening-port=5349
cert=/etc/coturn/certs/turn.crt
pkey=/etc/coturn/certs/turn.key
listening-ip=0.0.0.0
external-ip=__PUBLIC_IP__
relay-ip=__PUBLIC_IP__
min-port=49152
max-port=65535
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=__TURN_REALM__
# Media only: never relay into private networks or back to the box.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Small box, small limits.
total-quota=200
user-quota=12
max-bps=1500000
stale-nonce=600
no-tlsv1
no-tlsv1_1
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
syslog
# Keep logs free of session detail.
no-software-attribute
